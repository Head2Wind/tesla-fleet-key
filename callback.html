<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The authorization code is in this page's URL. Never send it anywhere:
     no referrer, no external scripts, fonts or images, no analytics. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Tesla sign-in code</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --box:#f3f3f3; --ok:#0a7d32; --bad:#b00020; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --muted:#aaa; --box:#222; --ok:#5fd38a; --bad:#ff6b7f; } }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:640px; margin:0 auto; }
  code { display:block; padding:12px; background:var(--box); border-radius:6px;
         word-break:break-all; font-family:ui-monospace, Consolas, monospace; }
  button { margin-top:12px; padding:8px 16px; font:inherit; cursor:pointer; }
  .muted { color:var(--muted); font-size:14px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Tesla sign-in code</h1>
  <p id="msg">Reading…</p>
  <code id="url" hidden></code>
  <button id="copy" hidden>Copy</button>
  <p class="muted">Paste this into the terminal where <code style="display:inline;padding:0 4px">supercharger-collect.py login</code>
     is waiting. The code works once and expires within minutes. This page sends nothing anywhere.</p>
</main>
<script>
  // Hand the WHOLE callback URL back to the CLI: it checks `state` itself, so a
  // code from a sign-in it did not start is rejected there, not trusted here.
  var q = new URLSearchParams(location.search), msg = document.getElementById("msg");
  if (q.get("error")) {
    msg.className = "bad";
    msg.textContent = "Tesla returned an error: " + q.get("error") + " " + (q.get("error_description") || "");
  } else if (q.get("code")) {
    msg.className = "ok";
    msg.textContent = "Signed in. Copy the line below:";
    var box = document.getElementById("url"), btn = document.getElementById("copy");
    box.textContent = location.href; box.hidden = false; btn.hidden = false;
    btn.onclick = function () {
      navigator.clipboard.writeText(location.href).then(function () { btn.textContent = "Copied"; });
    };
  } else {
    msg.textContent = "No sign-in code here. Start from `supercharger-collect.py login`.";
  }
</script>
</body>
</html>
